name: Build issue 337 test APK

on:
  push:
    branches:
      - build/issue-337-test-apk

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build test APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Upload arm64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: LavenderPhotos-issue337-arm64-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
