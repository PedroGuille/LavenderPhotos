name: Build custom album covers test APK

on:
  push:
    branches:
      - build/issue-356-test-apk

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Prepare a separate test installation
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          text = p.read_text().replace('    buildTypes {', '    buildTypes {\n        debug {\n            applicationIdSuffix = ".covers.test"\n            versionNameSuffix = "-covers356"\n        }')
          p.write_text(text)
          p = Path('app/src/main/AndroidManifest.xml')
          text = p.read_text().replace('com.kaii.photos.LavenderPhotos.fileprovider', '${applicationId}.LavenderPhotos.fileprovider').replace('com.kaii.photos.content_provider', '${applicationId}.content_provider').replace('android:label="@string/app_name"', 'android:label="Lavender Covers Test"')
          p.write_text(text)
          for name, old, new in [
              ('MediaStoreUtils.kt', '"com.kaii.photos.LavenderPhotos.fileprovider"', 'com.kaii.photos.BuildConfig.APPLICATION_ID + ".LavenderPhotos.fileprovider"'),
              ('LavenderContentProvider.kt', '"com.kaii.photos.content_provider"', 'com.kaii.photos.BuildConfig.APPLICATION_ID + ".content_provider"')
          ]:
              p = Path('app/src/main/java/com/kaii/photos/mediastore') / name
              p.write_text(p.read_text().replace(old, new))
      - name: Build APK and run unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --console=plain
      - name: Upload arm64 test APK
        uses: actions/upload-artifact@v4
        with:
          name: LavenderPhotos-issue356-arm64-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue356-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  cover-storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build instrumented storage tests for emulator
        run: |
          sed -i 's/arrayOf("armeabi-v7a", "arm64-v8a")/arrayOf("x86_64")/' app/build.gradle.kts
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify cover persistence, replacement, and reset on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 1536M
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kaii.photos.AlbumCoverStoreTest --no-daemon --console=plain
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue356-android-test-results
          path: app/build/reports/androidTests/connected
          if-no-files-found: ignore
